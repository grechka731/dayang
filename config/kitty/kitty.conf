include themes/depressive_rose.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5
line_height      1.05
disable_ligatures never

window_padding_width 12
hide_window_decorations yes
background_opacity 0.93
background_blur 5
inactive_text_alpha 0.8

cursor_shape     block
cursor_blink_interval 0.5
cursor_trail 0.5
cursor_trail_decay 0.1 0.2
cursor_trail_start_threshold 2

enable_audio_bell no
window_alert_on_bell no
scrollback_lines 20000
editor nvim
repaint_delay 8
input_delay 2

mouse_hide_wait 3.0
detect_urls yes
open_url_with default
url_color #89b4fa
url_style curly

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

map ctrl+shift+t        new_tab
map ctrl+shift+w        close_tab
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+alt+t    set_tab_title

map ctrl+shift+minus      launch --location=hsplit
map ctrl+shift+backslash  launch --location=vsplit

map ctrl+alt+left         neighboring_window left
map ctrl+alt+right        neighboring_window right
map ctrl+alt+up           neighboring_window up
map ctrl+alt+down         neighboring_window down

map ctrl+shift+r          start_resizing_window
