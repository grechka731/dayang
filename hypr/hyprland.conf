# ============================================================
# hyprland.conf — Depressive Rose dots for Artix Linux
# Compatible: Hyprland 0.41+
# ============================================================

# --- Autostart ---
exec-once = ~/.config/scripts/wallpaper.sh init
exec-once = waybar
exec-once = mako

# --- Variables ---
$terminal = kitty
$menu     = rofi -show drun -theme ~/.config/rofi/launchers/type-7/style-5.rasi

# ============================================================
# KEYBINDS
# ============================================================

bind = SUPER, Return, exec, $terminal
bind = SUPER, R,      exec, $menu
bind = SUPER, Q,      killactive
bind = SUPER, M,      exit
bind = SUPER, F,      fullscreen
bind = SUPER, V,      togglefloating

bind = ,      Print,  exec, ~/.config/scripts/screenshot.sh area
bind = SHIFT, Print,  exec, ~/.config/scripts/screenshot.sh full
bind = SUPER, Print,  exec, ~/.config/scripts/screenshot.sh window

bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d

bind = SUPER SHIFT, left,  movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up,    movewindow, u
bind = SUPER SHIFT, down,  movewindow, d

binde = SUPER ALT, left,  resizeactive, -30 0
binde = SUPER ALT, right, resizeactive,  30 0
binde = SUPER ALT, up,    resizeactive,  0 -30
binde = SUPER ALT, down,  resizeactive,  0  30

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up,   workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

binde = , XF86AudioRaiseVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
binde = , XF86AudioLowerVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind  = , XF86AudioMute,         exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind  = , XF86AudioPlay,         exec, playerctl play-pause
bind  = , XF86AudioNext,         exec, playerctl next
bind  = , XF86AudioPrev,         exec, playerctl previous

binde = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ============================================================
# GENERAL
# ============================================================
general {
    gaps_in             = 5
    gaps_out            = 10
    border_size         = 2
    col.active_border   = rgb(4e6e4e)
    col.inactive_border = rgb(3e2e34)
    layout              = dwindle
}

# ============================================================
# DECORATION
# ============================================================
decoration {
    rounding         = 8
    active_opacity   = 1.0
    inactive_opacity = 0.95

    # --- Shadow (новый синтаксис 0.41+) ---
    shadow {
        enabled       = true
        range         = 12
        render_power  = 3
        color         = rgba(00000066)
    }

    # --- Blur ---
    blur {
        enabled = true
        size    = 5
        passes  = 2
    }
}

# ============================================================
# ANIMATIONS
# ============================================================
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = easeOut,  0.16, 1,   0.3, 1
    bezier = easeIn,   0.7,  0,   0.84, 0

    animation = windows,     1, 5, myBezier
    animation = windowsOut,  1, 4, easeIn,  popin 80%
    animation = windowsMove, 1, 4, easeOut
    animation = border,      1, 8, default
    animation = fade,        1, 6, default
    animation = workspaces,  1, 5, easeOut
}

# ============================================================
# LAYOUT
# ============================================================
dwindle {
    force_split    = 2
    preserve_split = true
}

# ============================================================
# INPUT
# ============================================================
input {
    kb_layout  = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

# ============================================================
# MISC
# ============================================================
misc {
    force_default_wallpaper  = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
}

# ============================================================
# WINDOW RULES (новый синтаксис windowrulev2 для 0.41+)
# ============================================================
windowrulev2 = float,  class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = size 800 600, class:^(pavucontrol)$

windowrulev2 = float,  class:^(nm-connection-editor)$
windowrulev2 = center, class:^(nm-connection-editor)$

windowrulev2 = float,  class:^(swappy)$
windowrulev2 = center, class:^(swappy)$

windowrulev2 = float,  class:^(org.gnome.Calculator)$

windowrulev2 = opacity 0.95 0.90, class:^(kitty)$
